<!doctype html>
<html lang="es" data-accent="violet">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Biblioteca de Alejandría</title>
  <meta name="description" content="Lleva el control de tus manhwas, mangas, animes, series, películas y deportes: fútbol, NBA, MLB, F1 y UFC.">
  <meta name="theme-color" content="#0b0a14">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alejandría">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

  <div id="splash" aria-hidden="true">
    <img src="icons/icon.svg" alt="" width="84" height="84">
    <span>Biblioteca de Alejandría</span>
  </div>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Navegación principal">
    <a href="#/" data-tab="home"><span class="ic" data-icon="home"></span><span>Biblioteca</span></a>
    <a href="#/plataformas" data-tab="plataformas"><span class="ic" data-icon="tv"></span><span>Plataformas</span></a>
    <button class="fab" id="fab" aria-label="Agregar obra"><span class="ic" data-icon="plus"></span></button>
    <a href="#/deportes" data-tab="deportes"><span class="ic" data-icon="ball"></span><span>Deportes</span></a>
    <a href="#/stats" data-tab="stats"><span class="ic" data-icon="chart"></span><span>Estadísticas</span></a>
  </nav>

  <div id="toasts" aria-live="polite"></div>
  <div id="offline-pill" hidden><span class="ic" data-icon="wifiOff"></span> Sin conexión · tu lista sigue disponible</div>

  <noscript><p style="padding:2rem;color:#fff">Esta app necesita JavaScript activado.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
